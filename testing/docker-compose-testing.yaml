services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    environment:
      - ENVIRONMENT=development

  backend-test:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    environment:
      - "DATABASE_URL=sqlite:///:memory:"
    command: pytest -v

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend-test:
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run lint && npm test && npm run build"

  admin:
    build:
      context: ../admin
    ports:
      - "5174:5174"
    env_file:
      - ../admin/.env
    volumes:
      - ../admin:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5174/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin-test:
    build:
      context: ../admin
    volumes:
      - ../admin:/app
      - /app/node_modules
    command: sh -c "npm install && npm run lint && npm test && npm run build"

  e2e-test:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CI=true
    command: sh -c "npm install && npx playwright test"
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy

networks:
  default:
    name: erp-testing-network

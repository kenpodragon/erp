services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    environment:
      - ENVIRONMENT=development

  backend-test:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=sqlite:///./test.db
    command: pytest -v

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-test:
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm run lint && npm test && npm run build"

  admin:
    build:
      context: ../admin
    ports:
      - "5174:5174"
    env_file:
      - ../admin/.env
    volumes:
      - ../admin:/app
      - /app/node_modules
    depends_on:
      - backend

  admin-test:
    build:
      context: ../admin
    volumes:
      - ../admin:/app
      - /app/node_modules
    command: sh -c "npm run lint && npm test && npm run build"

  e2e-test:
    image: mcr.microsoft.com/playwright:v1.50.1-noble
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CI=true
    command: sh -c "npm install && npx playwright test"
    depends_on:
      - frontend
      - admin

networks:
  default:
    name: erp-testing-network

# Run from infra/deploy/: docker compose up
# All paths relative to repo root (context: ../..)

name: erp

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.db
    ports:
      - "5433:5432"
    env_file:
      - ./db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_app_user -d erp_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
    volumes:
      - ../../backend:/app
    environment:
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.frontend
    ports:
      - "5173:5173"
    env_file:
      - ../../frontend/.env
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.admin
    ports:
      - "5174:5174"
    env_file:
      - ../../admin/.env
    volumes:
      - ../../admin:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  default:
    name: erp-network

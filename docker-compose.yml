services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  default:
    name: erp-network

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development

  backend-test:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./test.db
    command: pytest

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-lint:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run lint

  admin:
    build:
      context: ./admin
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

  admin-lint:
    build:
      context: ./admin
    volumes:
      - ./admin:/app
      - /app/node_modules
    command: npm run lint

networks:
  default:
    name: erp-network

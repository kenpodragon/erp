services:
  postgres:
    build:
      context: ./db
      dockerfile: deploy/Dockerfile
    ports:
      - "5433:5432"
    env_file:
      - ./db/deploy/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_app_user -d erp_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  default:
    name: erp-network
